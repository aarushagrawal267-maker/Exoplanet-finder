[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exofinder"
version = "1.0.0"
description = "Exoplanet Finder: AI-powered Kepler transit signal classification platform"
requires-python = ">=3.11"

[project.scripts]
exofinder = "exofinder.cli:main"

[tool.setuptools.packages.find]
include = ["exofinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test needs live access to NASA services (run with -m network)",
    "slow: long-running test",
]
addopts = "-m 'not network'"
filterwarnings = ["ignore::UserWarning:lightkurve.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Long lines are left to the formatter; SIM300 misfires on set-inclusion asserts.
ignore = ["E501", "SIM300"]
